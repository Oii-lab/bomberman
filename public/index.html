<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💣 BOMBERMAN ONLINE</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 大廳 -->
<div id="lobby">
  <div class="lobby-bg"></div>
  <div class="lobby-card">
    <div class="logo">
      <span class="logo-bomb">💣</span>
      <h1>BOMBERMAN</h1>
      <span class="logo-sub">ONLINE</span>
    </div>
    <div class="form-group">
      <label>你的名字</label>
      <input id="nameInput" type="text" maxlength="12" placeholder="Enter name..." autocomplete="off">
    </div>
    <div class="form-group">
      <label>房間 ID</label>
      <div class="room-row">
        <input id="roomInput" type="text" maxlength="30" placeholder="room-abc" autocomplete="off">
        <button id="randomRoomBtn" title="隨機">🎲</button>
      </div>
    </div>
    <button id="joinBtn" class="btn-primary">進入房間</button>
    <p class="hint">⚡ 與朋友輸入同一個房間 ID 即可對戰</p>
    <div id="lobbyError" class="error-msg"></div>
  </div>
</div>

<!-- 等待 -->
<div id="waiting" class="hidden fullscreen-center">
  <div class="waiting-card">
    <div class="spinner"></div>
    <h2>等待對手加入...</h2>
    <p>把房間 ID 分享給朋友</p>
    <div class="room-tag" id="waitingRoom"></div>
  </div>
</div>

<!-- 遊戲 -->
<div id="game" class="hidden">
  <div id="hud">
    <div class="hud-side">
      <span class="hud-dot p0-dot">🔴</span>
      <div class="hud-info">
        <span class="hud-name" id="hud0name">P1</span>
        <span class="hud-stats" id="hud0stats"></span>
      </div>
      <span class="hud-hp" id="hud0status">❤️</span>
    </div>
    <div class="hud-mid">
      <span id="themeLabel"></span>
      <span id="gameStatus">進行中</span>
    </div>
    <div class="hud-side hud-side-right">
      <span class="hud-hp" id="hud1status">❤️</span>
      <div class="hud-info hud-info-right">
        <span class="hud-name" id="hud1name">P2</span>
        <span class="hud-stats" id="hud1stats"></span>
      </div>
      <span class="hud-dot p1-dot">🔵</span>
    </div>
  </div>

  <div id="canvasWrap">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="footer">
    <span id="myControls"></span>
    <span class="item-legend">道具：💣炸彈數 🔥射程 ⚡加速 👻穿牆彈 📡遙控彈</span>
  </div>
</div>

<!-- 結算 overlay -->
<div id="overlay" class="hidden fullscreen-center">
  <div class="overlay-card">
    <div class="overlay-icon" id="overlayIcon">💥</div>
    <h2 id="overlayTitle"></h2>
    <p id="overlayMsg"></p>
    <button id="restartBtn" class="btn-primary">再來一局</button>
  </div>
</div>

<!-- 對手離線 -->
<div id="disconnected" class="hidden fullscreen-center">
  <div class="overlay-card">
    <div class="overlay-icon">🔌</div>
    <h2>對手已離線</h2>
    <button onclick="location.reload()" class="btn-primary">回大廳</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/game.js"></script>
</body>
</html>
