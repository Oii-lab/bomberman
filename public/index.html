<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💣 BOMBERMAN ONLINE</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── LOBBY ── -->
<div id="lobby">
  <div class="lobby-bg"></div>
  <div class="lobby-card">
    <div class="logo">
      <span class="logo-bomb">💣</span>
      <h1>BOMBERMAN</h1>
      <span class="logo-sub">ONLINE</span>
    </div>
    <div class="form-group">
      <label>你的名字</label>
      <input id="nameInput" type="text" maxlength="12" placeholder="Enter name..." autocomplete="off">
    </div>
    <div class="form-group">
      <label>房間 ID</label>
      <div class="room-row">
        <input id="roomInput" type="text" maxlength="20" placeholder="room-123" autocomplete="off">
        <button id="randomRoomBtn" title="隨機房間">🎲</button>
      </div>
    </div>
    <button id="joinBtn" class="btn-join">進入房間</button>
    <p class="hint">⚡ 與朋友分享同一個房間 ID 即可對戰</p>
    <div id="lobbyError" class="error-msg"></div>
  </div>
</div>

<!-- ── WAITING ── -->
<div id="waiting" class="hidden">
  <div class="waiting-card">
    <div class="spinner"></div>
    <h2>等待對手...</h2>
    <p>把房間 ID 分享給朋友</p>
    <div class="room-display" id="waitingRoom"></div>
  </div>
</div>

<!-- ── GAME ── -->
<div id="game" class="hidden">
  <div id="hud">
    <div class="hud-player" id="hud0">
      <span class="hud-icon">🔴</span>
      <span class="hud-name" id="hud0name">P1</span>
      <span class="hud-status" id="hud0status">❤️</span>
    </div>
    <div class="hud-center">
      <span id="gameStatus">進行中</span>
    </div>
    <div class="hud-player" id="hud1">
      <span class="hud-status" id="hud1status">❤️</span>
      <span class="hud-name" id="hud1name">P2</span>
      <span class="hud-icon">🔵</span>
    </div>
  </div>
  <div id="canvasWrap">
    <canvas id="gameCanvas"></canvas>
  </div>
  <div id="controls-hint">
    <span id="myControls"></span>
  </div>
</div>

<!-- ── GAME OVER OVERLAY ── -->
<div id="overlay" class="hidden">
  <div class="overlay-card">
    <div id="overlayIcon">💥</div>
    <h2 id="overlayTitle">遊戲結束</h2>
    <p id="overlayMsg"></p>
    <button id="restartBtn" class="btn-join">再來一局</button>
  </div>
</div>

<!-- ── DISCONNECTED ── -->
<div id="disconnected" class="hidden">
  <div class="overlay-card">
    <div>🔌</div>
    <h2>對手已離線</h2>
    <button onclick="location.reload()" class="btn-join">回大廳</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/game.js"></script>
</body>
</html>
